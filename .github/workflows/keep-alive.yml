name: ML keep-alive (school hours)

# Render's free plan puts a service to sleep after 15 idle minutes, and the ML service then takes
# a minute or more to wake (imports and models). Pinging it every 10 minutes during school hours
# keeps grammar checks and imports fast in the labs.
#
# Hours: weekdays 07:00-18:00 Philippine time = 23:00-10:00 UTC (Sunday 23:00 UTC is Monday 07:00 PHT).
# Budget: about 66 runs per weekday (~1,450 Actions minutes a month) and ~240 awake hours a month,
# inside Render's 750 free instance-hours. The Express server starts in seconds and is not pinged.
on:
  schedule:
    - cron: '*/10 23 * * 0-4'
    - cron: '*/10 0-9 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the ML service
        run: |
          for attempt in 1 2; do
            if curl -fsS --max-time 60 -o /dev/null -w "ML /health %{http_code} in %{time_total}s\n" https://intellidocs-ml.onrender.com/health; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
