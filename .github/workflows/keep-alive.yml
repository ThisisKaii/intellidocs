name: Render Services Keep-Alive (24/7)

# Architecture:
# - Account 1: Express Server (intellidocs-server-1yxr.onrender.com)
# - Account 2: Python ML (intellidocs-885t.onrender.com)
#
# Because they are hosted on two separate Render accounts, each service has its own
# dedicated 750 free instance-hours pool. Running 24/7 consumes ~720 hours/month per account,
# staying safely within the 750-hour free limit with 0 risk of suspension.
#
# GitHub Actions runs on Microsoft Azure runner IP space, completely bypassing Cloudflare 429 rate limits.
on:
  schedule:
    - cron: '*/12 * * * *'  # Runs every 12 minutes, 24/7
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Server & ML Service
        run: |
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          SERVER_URL="https://intellidocs-server-1yxr.onrender.com/health"
          ML_URL="https://intellidocs-885t.onrender.com/health"

          ping_url() {
            local name="$1"
            local url="$2"
            echo "Pinging $name at $url..."
            for attempt in 1 2 3; do
              if curl -fsS --max-time 75 -A "$USER_AGENT" -o /dev/null -w "$name /health returned %{http_code} in %{time_total}s\n" "$url"; then
                return 0
              fi
              echo "Attempt $attempt for $name failed or timed out; retrying in 15s..."
              sleep 15
            done
            echo "Failed to wake $name after 3 attempts"
            return 1
          }

          ping_url "Server" "$SERVER_URL"
          SERVER_STATUS=$?

          ping_url "ML" "$ML_URL"
          ML_STATUS=$?

          if [ $SERVER_STATUS -ne 0 ] || [ $ML_STATUS -ne 0 ]; then
            exit 1
          fi
          echo "All live services are active and healthy."
