services:
  - type: web
    name: intellidocs-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 2
      targetMemoryPercent: 75
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: intellidocs-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_POOLER_URL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: ARCJET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: intellidocs-ml
    runtime: docker
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BASE_MODEL_PATH
        value: models/base_model.pkl
      - key: USER_MODEL_DIR
        value: models/user_models
      - key: PORT
        value: '8000'
      - key: DUCKDB_PATH
        value: db/duckdb/behavior.duckdb
    disk:
      name: ml-models
      mountPath: /app/models
      sizeGB: 1
