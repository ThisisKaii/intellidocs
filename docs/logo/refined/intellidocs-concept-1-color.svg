<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">IntelliDocs — Letterform I (Full Colour)</title>
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#388087"/>
      <stop offset="100%" stop-color="#2D6B6E"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2EDCE"/>
      <stop offset="100%" stop-color="#A8DBC5"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F6F2"/>
      <stop offset="100%" stop-color="#E8E8E0"/>
    </linearGradient>
  </defs>

  <!-- I-stem with teal gradient -->
  <rect x="104" y="28" width="48" height="200" fill="url(#tealGrad)" rx="8"/>

  <!-- Top serifs with overshoot -->
  <rect x="88" y="24" width="80" height="8" fill="url(#tealGrad)" rx="4"/>
  <!-- Bottom serifs with overshoot -->
  <rect x="88" y="224" width="80" height="8" fill="url(#tealGrad)" rx="4"/>

  <!-- Folded corner at φ (256/φ ≈ 158) with mint gradient -->
  <path d="M152 28 L248 28 L248 124 L152 124 Z" fill="url(#mintGrad)"/>

  <!-- Fold crease: subtle highlight -->
  <path d="M152 124 L248 28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Neural spark at fold intersection with teal gradient -->
  <circle cx="200" cy="56" r="14" fill="url(#tealGrad)"/>

  <!-- Subtle paper texture hint on stem -->
  <rect x="104" y="28" width="48" height="200" fill="url(#paperGrad)" rx="8" opacity="0.05"/>
</svg>