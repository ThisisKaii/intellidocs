<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept 3B: Abstract Convergent Brackets - Solid forms -->
  <!-- Left bracket as solid shape -->
  <path d="M16 24 L32 24 L32 40 L20 40 L20 100 L32 100 L32 116 L16 116 Z" fill="#000"/>
  <!-- Right bracket mirrored -->
  <path d="M112 24 L96 24 L96 40 L112 40 L112 100 L96 100 L96 116 L112 116 Z" fill="#000"/>
  <!-- Converging inner arms -->
  <path d="M44 52 Q64 64 84 52" stroke="#000" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M44 76 Q64 64 84 76" stroke="#000" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Central neural node (larger) -->
  <circle cx="64" cy="64" r="10" fill="#000"/>
  <!-- Orbiting nodes -->
  <circle cx="64" cy="40" r="5" fill="#000"/>
  <circle cx="82" cy="76" r="5" fill="#000"/>
  <circle cx="46" cy="76" r="5" fill="#000"/>
  <!-- Pulse ring -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
</svg>