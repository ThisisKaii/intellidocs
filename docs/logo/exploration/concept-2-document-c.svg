<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept 2C: Pictorial Document - Folded corner, academic heading style -->
  <rect x="20" y="12" width="88" height="104" fill="#000" rx="6"/>
  <!-- Folded corner at top-right (golden section) -->
  <path d="M80 12 L108 12 L108 40 L80 40 Z" fill="#000"/>
  <path d="M80 40 L108 12" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Heading line (bold) -->
  <rect x="36" y="28" width="44" height="6" fill="#fff"/>
  <!-- Body lines -->
  <rect x="36" y="48" width="72" height="3" fill="#fff" opacity="0.6"/>
  <rect x="36" y="64" width="68" height="3" fill="#fff" opacity="0.5"/>
  <rect x="36" y="80" width="56" height="3" fill="#fff" opacity="0.5"/>
  <!-- Pen nib at folded corner -->
  <path d="M92 36 L108 52 L76 52 Z" fill="#000"/>
  <line x1="92" y1="36" x2="92" y2="44" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
</svg>