<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept 1A: Letterform I - Folded corner I, black only -->
  <rect x="48" y="16" width="32" height="96" fill="#000" rx="4"/>
  <!-- Folded corner at top-right (golden ratio: 128/φ ≈ 79) -->
  <path d="M80 16 L112 16 L112 48 L80 48 Z" fill="#000"/>
  <path d="M80 48 L112 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Serif at top-left -->
  <rect x="40" y="16" width="8" height="4" fill="#000"/>
  <rect x="80" y="16" width="8" height="4" fill="#000"/>
  <!-- Base serif -->
  <rect x="40" y="108" width="8" height="4" fill="#000"/>
  <rect x="80" y="108" width="8" height="4" fill="#000"/>
  <!-- Neural spark at fold point -->
  <circle cx="96" cy="32" r="6" fill="#000"/>
</svg>