<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Concept 1C: Letterform I - Minimal geometric I with fold at φ -->
  <rect x="48" y="16" width="32" height="96" fill="#000"/>
  <!-- Fold at φ (128/φ ≈ 79) - fold corner -->
  <path d="M79 16 L112 16 L112 49 L79 49 Z" fill="#000"/>
  <!-- Fold crease -->
  <path d="M79 49 L112 16" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Neural spark at fold intersection -->
  <circle cx="95" cy="32" r="5" fill="#000"/>
</svg>