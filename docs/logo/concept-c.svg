<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Concept C: "Folded Intelligence" — Harmony of Document + AI
    Construction: 24×24 unit grid, 2px stroke, φ-corner (r=1.23), golden section fold
    Metaphors: Document with folded corner revealing neural core beneath
    Color: Soft-teal #388087 (primary), Mint #C2EDCE (accent), Warm paper #F6F6F2
  -->
  <defs>
    <linearGradient id="paperGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F2"/>
      <stop offset="100%" stop-color="#ECECE4"/>
    </linearGradient>
    <linearGradient id="tealGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388087"/>
      <stop offset="100%" stop-color="#1F5A5C"/>
    </linearGradient>
    <linearGradient id="mintGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2EDCE"/>
      <stop offset="100%" stop-color="#8FD4B0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#388087" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2D6B6E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1F5A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base document sheet (φ proportions) -->
  <rect x="2" y="2" width="15" height="20" rx="1.23" ry="1.23"
        fill="url(#paperGradC)" stroke="url(#tealGradC)" stroke-width="2"/>

  <!-- Folded corner (golden section: 15/φ ≈ 9.27 from right) -->
  <path d="M11.5 2 L17 2 L17 7.5 L11.5 7.5 Z"
        fill="url(#mintGradC)" stroke="url(#tealGradC)" stroke-width="1.5"/>

  <!-- Fold crease (diagonal) -->
  <path d="M11.5 7.5 L17 2"
        stroke="url(#tealGradC)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Revealed neural core beneath fold -->
  <g transform="translate(12.5, 3.5)">
    <!-- Core glow -->
    <circle cx="1.75" cy="1.75" r="2.8"
            fill="url(#coreGlow)" opacity="0.85"/>

    <!-- 3-layer neural pattern -->
    <circle cx="1.75" cy="1.75" r="1.2"
            fill="#F6F6F2" stroke="url(#tealGradC)" stroke-width="1.2"/>
    <circle cx="1.75" cy="1.75" r="0.6"
            fill="url(#mintGradC)"/>

    <!-- 4 synaptic connections at 45° intervals -->
    <g stroke="url(#mintGradC)" stroke-width="1" stroke-linecap="round" opacity="0.7">
      <line x1="1.75" y1="0.55" x2="1.75" y2="0.05"/>
      <line x1="2.95" y1="1.75" x2="3.45" y2="1.75"/>
      <line x1="1.75" y1="2.95" x2="1.75" y2="3.45"/>
      <line x1="0.55" y1="1.75" x2="0.05" y2="1.75"/>
    </g>
  </g>

  <!-- Document text lines (restrained, academic) -->
  <g stroke="url(#tealGradC)" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <line x1="4.5" y1="11" x2="14" y2="11"/>
    <line x1="4.5" y1="13.5" x2="12.5" y2="13.5"/>
    <line x1="4.5" y1="16" x2="15" y2="16"/>
    <line x1="4.5" y1="18.5" x2="11" y2="18.5"/>
  </g>

  <!-- Subtle page indicator (bottom right) -->
  <rect x="15.5" y="18.5" width="3.5" height="1.5" rx="0.3"
        fill="url(#mintGradC)" opacity="0.6"/>
  <text x="17.25" y="19.6" font-size="1.1" font-family="system-ui, sans-serif"
        fill="url(#tealGradC)" text-anchor="middle" font-weight="600">1</text>

  <!-- Brand mark: small "I" at φ position from top-left -->
  <text x="3.8" y="5.8" font-size="2.8" font-family="Georgia, serif"
        fill="url(#tealGradC)" font-weight="700" letter-spacing="-0.2px">I</text>
</svg>