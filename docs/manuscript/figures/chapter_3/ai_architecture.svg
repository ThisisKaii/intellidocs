<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect x="40" y="20" width="1020" height="78" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="550.0" y="49.5" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">Presentation Layer</text><text x="550.0" y="68.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">React + TipTap editor: suggestion panel, AI Assistant chat, grammar underlines</text><rect x="40" y="140" width="1020" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="550.0" y="165.5" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">API Layer</text><text x="550.0" y="184.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Express gateway: authentication, rate limits, routing to the two tracks</text><polyline points="550.0,98.0 550.0,140.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)"/><text x="268.0" y="240.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" font-style="italic" text-anchor="end" dominant-baseline="central">Track 1: implicit behavior</text><text x="808.0" y="240.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" font-style="italic" text-anchor="end" dominant-baseline="central">Track 2: conversation</text><rect x="40" y="270" width="480" height="84" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="280.0" y="293.0" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">Behavioral Pipeline</text><text x="280.0" y="312.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Editor events → Redis event lists (per user and genre)</text><text x="280.0" y="331.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">→ aggregator → DuckDB behavior features</text><rect x="40" y="400" width="480" height="150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="280.0" y="422.0" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">ML Microservice (FastAPI)</text><rect x="60.0" y="448" width="92" height="74" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="106.0" y="475.5" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Tier 1</text><text x="106.0" y="494.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Rules</text><rect x="176.0" y="448" width="92" height="74" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="222.0" y="475.5" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Tier 2</text><text x="222.0" y="494.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">RandomForest</text><polyline points="152.0,485.0 176.0,485.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><rect x="292.0" y="448" width="92" height="74" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="338.0" y="466.0" font-family="'Times New Roman', Times, serif" 