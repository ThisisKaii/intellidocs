ght="150" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="820.0" y="422.0" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">MCP Tool Layer</text><rect x="600.0" y="448" width="136" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="668.0" y="469.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Read</text><text x="668.0" y="488.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">document, profile,</text><text x="668.0" y="507.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">behavior, prediction</text><rect x="752.0" y="448" width="136" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="820.0" y="469.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Plan</text><text x="820.0" y="488.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">format blocks, presets,</text><text x="820.0" y="507.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">captions, bibliography</text><rect x="904.0" y="448" width="136" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="972.0" y="469.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Suggest</text><text x="972.0" y="488.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">literature search,</text><text x="972.0" y="507.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">academic style</text><polyline points="280.0,210.0 280.0,270.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)"/><polyline points="280.0,354.0 280.0,400.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><polyline points="820.0,210.0 820.0,270.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)"/><polyline points="820.0,354.0 820.0,400.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><rect x="40" y="610" width="1020" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="550.0" y="632.0" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">Data Layer</text><rect x="70.0" y="650" width="300" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="220.0" y="664.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Supabase</text><text x="220.0" y="683.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">PostgreSQL: documents, feedback</text><text x="220.0" y="702.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Storage: pictures, user models</text><rect x="400.0" y="650" width="300" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="550.0" y="664.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Redis</text><text x="550.0" y="683.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">behavior event lists,</text><