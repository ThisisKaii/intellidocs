 = the format kept;</text><text x="550.0" y="841.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">runs by itself at 5 of them, then every 10 more: the user&#x27;s RandomForest and LSTM per genre</text><polyline points="550.0,730.0 550.0,780.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><rect x="240" y="910" width="620" height="66" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="550.0" y="933.5" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="central">Personalized ML Models</text><text x="550.0" y="952.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">each user&#x27;s RandomForest and LSTM per genre, in Supabase Storage</text><polyline points="550.0,864.0 550.0,910.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><polyline points="240.0,943.0 18.0,943.0 18.0,475.0 40.0,475.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="26.0" y="790.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="central">loaded for the user&#x27;s</text><text x="26.0" y="808.0" font-family="'Times New Roman', Times, serif" font-size="12.5" font-weight="normal" font-style="italic" text-anchor="start" dominant-baseline="central">predictions</text></svg>