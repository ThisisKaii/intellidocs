><text x="790.0" y="1080.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">its label and confidence replace</text><text x="790.0" y="1098.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">the RandomForest&#x27;s if higher</text><polyline points="510.0,1080.0 665.0,1080.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="532.0" y="1068.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">Yes</text><polyline points="790.0,1115.0 790.0,1172.0 384.0,1172.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><polyline points="380.0,1118.0 380.0,1198.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="396.0" y="1145.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">No</text><polygon points="380.0,1200.0 580.0,1258.0 380.0,1316.0 180.0,1258.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="380.0" y="1240.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Not baseline mode, and the user</text><text x="380.0" y="1258.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">has a fine-tuned RandomForest</text><text x="380.0" y="1275.5" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">for this genre?</text><polyline points="380.0,1198.0 380.0,1200.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><rect x="655.0" y="1218.0" width="270" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790.0" y="1231.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Blend in the user&#x27;s RandomForest</text><text x="790.0" y="1249.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">p = (1 − w) × p(answer) + w × p(user)</text><text x="790.0" y="1267.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">w = n ÷ (n + 20), at most 0.6</text><text x="790.0" y="1285.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">(n = the user&#x27;s labeled blocks)</text><polyline points="580.0,1258.0 655.0,1258.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="602.0" y="1246.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">Yes</text><polyline points="790.0,1298.0 790.0,1362.0 384.0,1362.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><polyline points="380.0,1316.0 380.0,1388.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="396.0" y="1339.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">No</text><polygon points="380.0,1396.0 580.0,1448.0 380.0,1500.0 180.0,1448.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="380.0" y="1439.2" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Hybrid mode, and the user&#x27;s</text><text x="380.0" y="1456.8" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">LSTM scores this label above 0?</text><polyline points="380.0,1388.0 380.0,1396.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><rect x="665.0" y="1417.0" width="250" height="62" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790.0" y="1439.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">Blend the confidence</text><text x="790.0" y="1457.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">0.7 × c + 0.3 × LSTM score</text><polyline points="580.0,1448.0 665.0,1448.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="602.0" y="1436.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">Yes</text><polyline points="915.0,1448.0 1000.0,1448.0" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="380.0,1500.0 380.0,1548.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="396.0" y="1524.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">No</text><rect x="190.0" y="1548.0" width="380" height="60" rx="30.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="380.0" y="1569.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">End: predicted format and confidence,</text><text x="380.0" y="1587.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">shown as a suggestion in the editor</text><polyline points="1000.0,160.0 1000.0,1578.0 570.0,1578.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/></svg>