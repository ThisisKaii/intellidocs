" dominant-baseline="central">Reference entry</text><text x="790.0" y="729.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">confidence 0.96</text><polyline points="550.0,720.0 685.0,720.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="572.0" y="708.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">Yes</text><polyline points="895.0,720.0 1000.0,720.0" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="164,108 150,108 150,764 164,764" fill="none" stroke="#000" stroke-width="1.5"/><text transform="rotate(-90 136 436.0)" x="136.0" y="436.0" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="central">Tier 1: rules</text><polygon points="380.0,800.0 570.0,850.0 380.0,900.0 190.0,850.0" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="380.0" y="841.2" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Isolated mode, and the user</text><text x="380.0" y="858.8" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">has an LSTM for this genre?</text><polyline points="380.0,764.0 380.0,800.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#head)"/><text x="396.0" y="782.0" font-family="'Times New Roman', Times, serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">No</text><rect x="685.0" y="823.0" width="210" height="54" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="790.0" y="841.0" font-family="'Times New Roman', Times, serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">User LSTM decides</text><text x="790.0" y="85