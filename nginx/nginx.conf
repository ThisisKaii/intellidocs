############################################################
# IntelliDocs production reverse proxy
#
# Terminates TLS, load balances across Express replicas, and fronts the
# Python ML service. Traffic is only ever sent to a replica that reports
# itself ready (GET /health/ready), so a replica with a dead Supabase or
# Redis connection is drained automatically instead of returning 500s.
############################################################

# Rate limit buckets. Sized per route class rather than globally so a burst of
# document autosaves cannot consume the budget reserved for auth and AI.
limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_zone:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

############################################################
# Upstreams
############################################################

# The sticky routing key. Authenticated traffic pins on the Authorization header
# so one user's requests stay on one replica; anonymous and unauthenticated
# requests fall back to the client address, which is still a stable key.
map $http_authorization $sticky_key {
    default   $http_authorization;
    ""        $binary_remote_addr;
}

# Express replicas.
#
# Sticky routing hashes the Authorization header instead of the client IP.
# Auth is a stateless JWT, so pinning is not required for correctness, but it
# keeps every request from one token on one replica: in-flight editor
# autosave debounces and behavior buffers stay coherent, and a warm replica
# serves a returning user. Requests without a header fall back to a stable
# hash of the client address.
#
# max_fails/fail_timeout implement passive health checking: after 3 failed
# requests within 30s nginx stops routing to that replica for 30s. This needs
# no NGINX Plus, unlike the `health_check` directive.
upstream backend_servers {
    hash $sticky_key consistent;
    server server1:5000 max_fails=3 fail_timeout=30s;
    server server2:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# Python ML replicas. No session affinity: prediction calls are stateless, so
# least-conn keeps the two workers evenly loaded during grammar/spell bursts.
upstream ml_servers {
    least_conn;
    server ml1:8000 max_fails=3 fail_timeout=30s;
    server ml2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

############################################################
# Reusable proxy behaviour
############################################################

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;

# Retry the next replica on transient upstream failures. POST is included so a
# connection reset mid-upload retries rather than surfacing as a failed save.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# Uploads of multi-MB documents are slow to write; the read timeout must exceed
# the client write window or long saves get killed mid-stream.
proxy_connect_timeout 5s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Security headers. The editor loads no third-party scripts, so the policy can
# stay strict.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Matches the 100mb body limit configured in server/src/index.ts.
client_max_body_size 100m;
client_body_timeout  300s;

############################################################
# HTTP -> HTTPS redirect
############################################################
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow container/orchestrator health probes over plain HTTP.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

############################################################
# TLS termination + application traffic
############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Mount the certificate and key at these paths. Provisioning them is a
    # manual deployment step; see docs/DEPLOYMENT.md.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    limit_conn conn_zone 100;

    # ---------------------------------------------------------------------
    # Frontend
    # ---------------------------------------------------------------------
    location / {
        limit_req zone=general_zone burst=40 nodelay;

        # Single-page app: serve the built asset, fall back to index.html so
        # client-side routes resolve on a hard refresh.
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable, so cache them hard.
    location /assets/ {
        limit_req zone=general_zone burst=40 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Never cache the entry document or the API surface.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://backend_servers;
    }

    # Auth is the most attack-exposed surface: strict budget, no burst queue so
    # excess requests are rejected immediately instead of delaying the victim.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend_servers;
    }

    location /api/ai/ {
        limit_req zone=ai_zone burst=10 nodelay;
        # AI responses stream for a long time; allow a generous read window.
        proxy_read_timeout 600s;
        proxy_buffering    off;
        proxy_pass http://backend_servers;
    }

    # ---------------------------------------------------------------------
    # ML service, proxied directly for prediction/grammar/compliance traffic
    # ---------------------------------------------------------------------
    location /ml/ {
        limit_req zone=ai_zone burst=20 nodelay;
        proxy_pass http://ml_servers/;
    }

    # Probes must never be rate limited, otherwise a burst of checks looks like
    # an outage and nginx would drain healthy replicas.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
